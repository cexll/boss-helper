name: Main

on:
  # push:
  #   tags:
  #     - '*'
  workflow_dispatch:
  # schedule:
  #  - cron: "30 0 * * *"

permissions:
  contents: write
  discussions: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      current_time: ${{ steps.current_time.outputs.current_time }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get current time
        id: current_time
        run: echo "current_time=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set Release Environment
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "VITE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "VITE_RELEASE_MODE=release" >> $GITHUB_ENV

      - name: Set Prerelease Environment
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "VITE_VERSION=${{ steps.current_time.outputs.current_time }}.alpha" >> $GITHUB_ENV
          echo "VITE_RELEASE_MODE=alpha" >> $GITHUB_ENV

      - name: Build (all browsers) + artifact gate
        # Repaired 2026-09-21: previously ran `pnpm run build:noTsc`, a script
        # that does not exist in package.json (phantom enforcement), under a pnpm
        # lockfile cache while the repo ships bun.lock.
        run: |
          bun run build
          bun run build:smoke

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: .output/*-mv*/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .output
      - name: ls output
        run: ls -la .output

      - name: Release
        uses: softprops/action-gh-release@v2.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: .output/**

      - name: Prerelease
        uses: softprops/action-gh-release@v2.0.4
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{needs.build.outputs.current_time}}
          tag_name: ${{needs.build.outputs.current_time}}
          fail_on_unmatched_files: true
          prerelease: true
          files: .output/**
