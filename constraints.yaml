# ── Rehabilitation State ───────────────────────────────────────
rehabilitation:
  active: true
  phase: 'stabilize-harness'
  baseline_frozen: true
  command_entrypoint: npm run check:all
  runtime_verifier: npm run build:smoke
  broad_refactor_allowed: false
  work_unit_protocol: 'one-failure-or-one-module, claimed in the PR; no parallel refactor agents'
  readiness_gaps:
    ['automated-extension-e2e', 'mutation-testing', 'license-audit', 'repo-wide-coverage-block']
  enforced_by: 'AGENTS.md Rehabilitation gate + Verification Matrix + constraints.yaml baseline'

# ── Refactor Contract ──────────────────────────────────────────
refactor_contract:
  active: false
  kind: 'none'
  source_of_truth: []
  compare_depth: 'none'
  cutover_policy: 'none'
  forbidden_moves: []
  work_ownership: 'none'
  human_gates: []
  enforced_by: 'not active — no large-refactor overlay detected at init'

# ── Iteration Gates ────────────────────────────────────────────
iteration_gates:
  max_fix_cycles: 3
  checkpoint_commit_at_green: true
  test_weakening_forbidden: true
  one_task_one_branch: true
  enforced_by: 'AGENTS.md Agent Operating Rules (review-only)'

# ── Environments ───────────────────────────────────────────────
environments:
  local: 'full'
  staging: 'none — extension ships straight to store review'
  prod: 'none — agents never publish to Chrome/Edge/Firefox stores; store release is a human act via .github/workflows/main.yml on tags'
  enforced_by: 'credential scoping + AGENTS.md Environment tiers'
