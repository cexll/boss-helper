# ── Code Canonicality ──────────────────────────────────────────
code_canonicality:
  forbidden_suffixes:
    description: 'Filenames/identifiers matching these patterns are rejected at commit'
    patterns:
      - '(_v[0-9]+|_new|_old|_backup|_temp|_copy|_final|_real|_improved|_refactored|_fixed|_legacy|_deprecated|_archive|_save)'
      - '(V[0-9]+|New|Old|Legacy|Deprecated|Backup)$'
    enforced_by: '.git-hooks/check-naming.sh (pre-commit)'
  scratchpad_directories:
    description: 'Directories that must never appear in commits'
    paths: [tmp, scratch, backup, _old, deprecated, archive, wip]
    enforced_by: '.git-hooks/check-naming.sh + .gitignore'

# ── Size Limits ────────────────────────────────────────────────
size_limits:
  max_file_lines:
    value: 800 # 一般配置
    severity: 'block' # gate lint (lint:strict) + baseline ratchet; legacy oversize frozen at record time
    enforced_by: '.oxlintrc.gate.json (eslint/max-lines) via `bun run lint:strict`'
  max_crap_score:
    value: 15.76 # 一般配置 derived ceiling (c=15 @ coverage floor); see gate-templates README
    scope: 'diff-scoped — scripts/check-crap.mjs gates .ts files changed vs the PR base; full-repo scan is advisory (42 legacy functions above ceiling at freeze rev)'
    severity: 'block'
    enforced_by: 'scripts/change-risk-gate.mjs via scripts/check-crap.mjs (`bun run check:crap`)'
  max_complexity:
    value: 15 # 一般配置
    severity: 'block'
    enforced_by: '.oxlintrc.gate.json (eslint/complexity) via `bun run lint:strict`'
  max_function_lines:
    value: 200 # TS stack default (not profile-keyed)
    severity: 'block'
    enforced_by: '.oxlintrc.gate.json (eslint/max-lines-per-function) via `bun run lint:strict`'
  max_pr_diff_lines:
    value: 400
    description: 'PRs exceeding this require justification or splitting'
    severity: 'block'
    enforced_by: '.github/workflows/ci.yml layer6-diff-size-guard'

doc_budgets:
  AGENTS.md:
    target: 1600
    ceiling: 1950
  CONTEXT.md:
    target: 900
    ceiling: 1200

# ── Test Discipline ────────────────────────────────────────────
testing:
  min_line_coverage:
    value: 85
    scope: 'per-file, applied to changed/added .ts files on the diff; files absent from the coverage artifact count as 0% (fail closed)'
    severity: 'block'
    enforced_by: 'scripts/coverage-gate.mjs via `bun run check:coverage` (CI layer2)'
  tdd_mode:
    value: 'required'
    description: 'New behavior lands test-first; a PR adding a function with no test addition is a review failure (see Architecture Discipline)'
  forbid_mock_of_system_under_test:
    value: true
    description: 'Mock dependencies, never the system under test'

# ── Dependency Rules ───────────────────────────────────────────
dependencies:
  min_release_age_days:
    value: 3
    enforced_by: 'renovate.json (minimumReleaseAge)'
  no_circular_dependencies:
    value: true
    enforced_by: '.oxlintrc.gate.json (import/no-cycle) via `bun run lint:strict`; legacy cycles frozen in .baseline/findings.json'
  new_dependency_requires_justification:
    value: true
    description: "PR description must explain why existing tools can't do the job"
  allowed_licenses:
    value:
      [
        'MIT',
        'Apache-2.0',
        'BSD-2-Clause',
        'BSD-3-Clause',
        'ISC',
        '0BSD',
        'CC0-1.0',
        'Python-2.0',
        'Unlicense',
      ]
    enforced_by: 'review-only (no license audit gate wired — recorded readiness gap)'

# ── Anti-Drift ─────────────────────────────────────────────────
anti_drift:
  duplicate_code_threshold_percent:
    value: 3 # 一般配置
    min_tokens: 70
    severity: 'block'
    enforced_by: 'jscpd via `bun run duplicate-code`; clone count ratcheted in .baseline/findings.json'
  dead_code_min_confidence:
    value: 80
    severity: 'block'
    enforced_by: 'knip via `bun run dead-code` (knip.json); findings ratcheted as (file,kind) tuples'
  error_hygiene:
    severity: 'block'
    enforced_by: '.oxlintrc.gate.json (eslint/no-empty allowEmptyCatch:false, eslint/no-useless-catch) via lint:strict + CI'
    review_only_residue: 'catch-returns-default and stub-returns-success are not lint-decidable; owned by Conventions and human review (Enforcement Index → Known blind spots)'

# ── Module Boundaries ──────────────────────────────────────────
module_boundaries:
  layers: [entrypoints, composables, message, components, utils, types]
  allowed_dependency_directions: 'entrypoints → composables/message → utils/types; message and composables share only protocol types via src/message/index.ts; components → composables via inject'
  forbidden_import_patterns: []
  enforced_by: 'import/no-cycle (gate lint) + review-only direction rules (no dependency-cruiser installed)'

# ── Commit Discipline ──────────────────────────────────────────
commits:
  conventional_commits_required:
    value: true
    allowed_types: ['feat', 'fix', 'refactor', 'chore', 'docs', 'test', 'ci', 'build', 'perf']
    enforced_by: '.git-hooks/commit-msg'
    agent_co_author_required: true

# ── CI Pipeline ────────────────────────────────────────────────
ci:
  risk_layers: 5
  fast_checks_timeout_minutes: 5
  matrix: ['chrome', 'firefox', 'edge'] # build targets verified by `bun run build`

# ── Runtime Verification ───────────────────────────────────────
# Machine-readable mirror of the AGENTS.md Verification Matrix.
verification:
  surfaces:
    build-artifact:
      command: 'npm run build:smoke'
      evidence: 'built-manifest+entry-files'
      required_at: 'all'
    unit:
      command: 'npm run test'
      evidence: 'exit-code+pass-count'
      required_at: 'all'
    coverage:
      command: 'npm run check:coverage'
      evidence: 'per-file-percent-vs-85'
      required_at: 'pr'
    change-risk:
      command: 'npm run check:crap'
      evidence: 'function-crap-vs-ceiling'
      required_at: 'pr'
    anti-drift:
      command: 'npm run check:baseline'
      evidence: 'tuple-diff-vs-baseline'
      required_at: 'pr'

# ── Exemptions ─────────────────────────────────────────────────
exemptions:
  entries:
    - path: 'src/entrypoints/boss/chat/geek-chat-core.2.0.4.umd.min.js'
      kind: path_exemption
      rules: [size_limits, duplicate_code_detection, error_hygiene, dead_code_detection]
      reason: 'Vendored third-party minified chat-core bundle — not human-authored'
      expires: never
      exit_condition: 'none'
    - path: 'components.d.ts'
      kind: path_exemption
      rules: [size_limits, duplicate_code_detection, dead_code_detection]
      reason: 'Generated by unplugin-vue-components at build/dev time — never hand-edit'
      expires: never
      exit_condition: 'none'
    - path: 'auto-imports.d.ts'
      kind: path_exemption
      rules: [size_limits, duplicate_code_detection, dead_code_detection]
      reason: 'Generated by WXT auto-imports — never hand-edit'
      expires: never
      exit_condition: 'none'
  enforced_by: 'scripts/gates-lib.mjs reads this block (path + rules) and skips exempted paths in gate scans; entries are fail-closed: an entry whose path does not exist exits 2'

