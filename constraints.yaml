# constraints.yaml — machine-readable engineering constraints
# THIS FILE IS THE CANONICAL SOURCE for all regex patterns and numeric thresholds.
# Enforcement scripts (scripts/*.mjs, .git-hooks/*) read from here at runtime;
# do not hardcode duplicates. AGENTS.md and CI reference this file.
# Generated by harness-init 4.1.0 on 2026-09-21.

# ── Strictness Profile ─────────────────────────────────────────
strictness_profile:
  schema_version: '4.1.0'
  level: 'general' # 一般配置 — chosen explicitly by the user at Q1.4
  chosen_by_user: true
  downgrades:
    - control: coverage_gate
      profile_default: '85% per-file, CI block'
      chosen: '85% per-changed-file block (CI); whole-repo legacy debt frozen in baseline.legacy_untested_files'
      reason: 'Repo-wide istanbul instrumentation is unavailable under bun test (lcov only). The gate counts files absent from lcov as 0% covered, so the block is honest for changed files; untested legacy .ts files are registered, not subsidized.'
    - control: mutation_testing
      profile_default: 'optional (scheduled)'
      chosen: 'declined'
      reason: 'Stryker requires an istanbul coverage consumer the bun toolchain does not emit; installing it would fake the gate. Recorded as a readiness gap, not as covered.'
    - control: e2e_tests
      profile_default: 'required if UI/API surface'
      chosen: 'review-only extension walk protocol + automated built-artifact gate (build:smoke); no automated Playwright suite'
      reason: 'Browser-extension UI on zhipin.com requires a loaded extension plus a logged-in host page; no browser harness exists and seeding a test login is outside harness-init scope. Removal trigger: first PR touching src/components/ or src/entrypoints/boss/index.ts without a recorded walk -> install Playwright + web-ext.'
    - control: distributed_tracing_metrics
      profile_default: 'optional'
      chosen: 'not applicable'
      reason: 'No server process; extension runtime logs via src/utils/logger.ts (leveled) and user-visible stats.'

